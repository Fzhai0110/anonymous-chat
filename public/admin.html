<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员后台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="shell">
<header>
<div>
<h1>管理员后台</h1>
<p>请使用管理员密码登录</p>
</div>
<a href="/">返回聊天室</a>
</header>

<section id="loginPanel" class="panel">
<h2>管理员登录</h2>
<form id="loginForm">
<label for="adminPassword">管理员密码</label>
<input id="adminPassword" name="password"
type="password" autocomplete="current-password"
maxlength="200" placeholder="请输入管理员密码" required>
<div class="tools">
<button type="submit">登录</button>
</div>
</form>
<p id="loginMessage" role="status"></p>
<p class="hint">登录状态有效期为 8 小时。</p>
</section>

<section id="dashboard" hidden>
<div class="tools">
<button id="logoutButton" type="button" class="danger">退出登录</button>
</div>
<nav class="tabs">
<button type="button" data-tab="dashboard">Dashboard</button>
<button type="button" data-tab="reports">举报管理</button>
<button type="button" data-tab="visitors">访问记录</button>
<button type="button" data-tab="security">安全中心</button>
<button type="button" data-tab="sanctions">处罚记录</button>
</nav>
<section id="adminContent" class="panel">
选择上方菜单加载数据。
</section>
</section>
</main>
<script src="/admin.js"></script>
</body>
</html>
