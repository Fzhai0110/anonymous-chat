
name: Extract source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o anonymous-chat-3.0-source.zip -d .
      
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md wrangler.jsonc tsconfig.json package.json README.md public src migrations
          git commit -m "Extract Anonymous Chat source" || echo "No changes"
          git push
